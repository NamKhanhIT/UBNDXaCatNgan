name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    name: Backend .NET 8 Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Quanlycongviec.sln

      - name: Build Solution
        run: dotnet build Quanlycongviec.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test Quanlycongviec.sln --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Frontend Web Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: npm run build
