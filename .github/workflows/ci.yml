name: UBNDXaCN CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Build & Test Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Quanlycongviec.sln

      - name: Build Solution
        run: dotnet build Quanlycongviec.sln --no-restore -c Release

      - name: Run Tests
        run: dotnet test Quanlycongviec.sln --no-build -c Release --verbosity normal

  frontend-ci:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend/web
          npm ci

      - name: Build Frontend App
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: |
          cd frontend/web
          npm run build
